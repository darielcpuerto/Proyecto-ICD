<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Tienda de prueba — JSON-LD</title>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Product",
    "name": "Panel Solar 600W",
    "brand": {"@type": "Brand", "name": "SUNCAR"},
    "model": "ZY600M10NHB",
    "offers": {
      "@type": "Offer",
      "price": "150.00",
      "priceCurrency": "CUP",
      "availability": "https://schema.org/InStock",
      "seller": {"@type": "Organization", "name": "Tienda Demo"}
    }
  }
  </script>
</head>
<body>
  <h1>Panel Solar 600W</h1>
  <p>Desde 150.00 CUP · garantía 5 años</p>
</body>
</html>
